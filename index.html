<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inventario</title>
<style>
:root{--g:#10a43a;--gd:#06621c;--tx:#13302a;--mu:#5b6f66;--bd:#d8e6dc;--bg:#f2f7f3}
*{box-sizing:border-box}
body{margin:0;padding-top:50px;color:var(--tx);font:15px/1.4 system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);min-height:100vh}
button,input,textarea,select{font:inherit}
#app{max-width:640px;margin:0 auto;padding:16px 14px 80px}
.bn{position:fixed;top:0;left:0;right:0;z-index:70;height:50px;background:linear-gradient(135deg,#0fb43f,#06821f);color:#fff;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:10px;padding:0 12px}
.bn .t{flex:1;text-align:center;padding-left:70px}
.vb{background:#fff;color:var(--gd);border:0;border-radius:18px;font-weight:800;font-size:12.5px;padding:6px 12px;cursor:pointer;white-space:nowrap;width:70px;padding:6px 0}
.bt{border:0;border-radius:12px;padding:10px 14px;font-weight:700;color:#fff;background:var(--g);cursor:pointer}
.bt.w{background:#fff;color:var(--tx);border:2px solid var(--bd)}.bt.r{background:#e11d48}.bt.s{padding:6px 10px;font-size:12.5px}.bt:disabled{opacity:.6}
.bt.big{width:100%;padding:14px;font-size:17px;margin-top:12px}
h1{margin:6px 0 2px;text-align:center;font-size:28px;color:#0b5d1f}
h3{margin:14px 0 8px;font-size:16px}
.sub{text-align:center;color:var(--mu);font-weight:600;margin:0 0 16px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chip{border-radius:18px;padding:5px 14px;font-weight:800;color:#fff;background:var(--c)}
.ttl{font-size:19px;font-weight:800;flex:1;min-width:120px}
.demo{background:#fff;border:2px dashed #e5b800;border-radius:10px;padding:6px 12px;font-size:12.5px;font-weight:700;color:#7a5d00;margin-bottom:12px;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;border:2px solid var(--bd);background:#fff;border-radius:12px;padding:10px;font-weight:800;color:var(--mu);cursor:pointer}.tabs button.on{background:var(--g);border-color:var(--g);color:#fff}
.card{background:#fff;border:2px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:700;font-size:12.5px;color:var(--mu);margin-top:10px}
input[type=text],input[type=password],input[type=number]{width:100%;margin-top:4px;border:2px solid var(--bd);border-radius:10px;padding:11px 12px;background:#fff;color:var(--tx)}
input:focus{outline:0;border-color:var(--g)}
input[type=number]:placeholder-shown{background:#fff3c4;border-color:#e5b800}
.cf{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:end;margin-top:4px}.cf b{font-size:26px;padding-bottom:10px}.cf input{margin-top:2px;text-transform:uppercase;font:800 20px ui-monospace,Consolas,monospace;text-align:center}.cf small{display:block;font-weight:700;font-size:11.5px;color:var(--mu)}
.cw{display:flex;align-items:center;gap:0;border:2px solid var(--bd);border-radius:12px;background:#fff;margin-top:4px;overflow:hidden}.cw:focus-within{border-color:var(--g)}
.cw span{background:#effaf1;padding:14px 10px;font:800 18px ui-monospace,Consolas,monospace;color:var(--gd);white-space:nowrap}
.cw input{border:0;margin:0;border-radius:0;font:800 22px ui-monospace,Consolas,monospace;letter-spacing:1px}
.cdb{font:800 20px ui-monospace,Consolas,monospace;word-break:break-all}
.dsc{font-size:16px;font-weight:700;margin:2px 0 6px}
.tg{display:inline-block;border-radius:12px;padding:2px 11px;background:#0e9a22;color:#fff;font-weight:700;font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two input{font-size:26px;font-weight:800;text-align:center}
.note{background:#fff8d6;border:2px solid #e5b800;color:#7a5d00;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;margin:8px 0}
.bad{background:#ffe4e9;border:2px solid #e11d48;color:#9f1239;border-radius:10px;padding:10px;font-weight:700}
.emp{text-align:center;color:var(--mu);font-weight:700;padding:22px 10px;background:#fff;border-radius:14px}
.ms{min-height:18px;margin-top:8px;font-weight:700;font-size:13px;color:#be123c}
.tr{display:flex;align-items:center;gap:8px;border:2px solid #e3eee6;border-radius:10px;padding:8px 10px;margin-top:8px;background:#fff}.tr .in{flex:1;font-size:13.5px;min-width:0}.tr small{display:block;color:var(--mu);font-size:12px}
.tr.hl{cursor:pointer}.err{border-left:6px solid #e11d48}.wt{border-left:6px solid #f58a07}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chips span{border-radius:14px;padding:4px 11px;font-weight:800;font-size:12.5px;background:#fff;border:2px solid var(--bd)}
.mbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dif{color:#e11d48;font-weight:800}
.md{display:none;position:fixed;inset:0;z-index:100;background:rgba(10,30,20,.55);align-items:center;justify-content:center;padding:12px}
.mc{position:relative;background:#fff;border-radius:18px;border-top:8px solid var(--c,#0e9a22);max-width:440px;width:100%;padding:18px 20px;max-height:94vh;overflow:auto}
.mc h3{margin:0 0 6px;font-size:20px;padding-right:30px}
.ds{color:#33463e;margin:4px 0 10px;font-size:14px}
.x{position:absolute;right:10px;top:10px;border:0;background:#eef2ef;border-radius:50%;width:30px;height:30px;cursor:pointer;font-weight:900}
.fx{display:flex;gap:10px;margin-top:14px}.fx .bt{flex:1}
.pk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.pk button{border:3px solid var(--bd);background:#fff;border-radius:16px;padding:16px 8px;font-weight:800;font-size:16px;cursor:pointer;color:var(--tx)}
.pk button small{display:block;color:var(--mu);font-weight:600;font-size:12px;margin-top:2px}
.pk button.on{border-color:var(--g);background:#effaf1}
#tt{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111827;color:#fff;border-radius:18px;padding:8px 16px;font-weight:700;font-size:13px;z-index:300;display:none;max-width:90vw;text-align:center}
.wl{display:grid;gap:14px;margin-top:10px}.wl button{border:3px solid var(--c);background:#fff;border-radius:18px;padding:26px 14px;font-weight:800;font-size:24px;color:var(--c);cursor:pointer;text-align:center}.wl button small{display:block;color:var(--mu);font-weight:600;font-size:13px;margin-top:4px}
#bq{margin-bottom:6px}#bl{max-height:60vh;overflow:auto}
</style></head><body>
<div class="bn"><span class="t">📦 INVENTARIO</span><button id="cfgb" class="vb" data-a="cambiar" style="display:none">⚙ Cambiar</button></div>
<div id="app"></div><div id="md" class="md"></div><div id="tt"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* URL_API vacío = MODO DE PRUEBA (datos solo en este navegador). Pega aquí la URL de la aplicación web de Apps Script (termina en /exec). */
const URL_API='https://script.google.com/macros/s/AKfycbyvNaHycL5skG5FEwKROiQMBzKG1H3iKsq2HKqsnGzn9p8qBOAQpNc9vhuhsoMYk5bz/exec';
const PREF_DEF='FER.TI';
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const fm=x=>x===''||x==null?'—':x;
let S=ls('inv_cfg')||{},TAB='contar',REV=null,LOOK=0,CUR=null,HIST=ls('inv_hist')||[],PICK=S.conteo||0,SCR=(S.nombre&&S.conteo)?'main':'welcome',NAMES=ls('inv_names')||{},MCL=[],LASTIMG='';
const colC=()=>S.conteo==2?'#2563eb':'#0a8f2a';
function toast(t){const e=$('#tt');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function modal(h,col,wide){const m=$('#md');m.innerHTML='<div class="mc" style="--c:'+(col||'#0e9a22')+(wide?';max-width:980px':'')+'">'+h+'</div>';m.style.display='flex'}
function cerrar(){$('#md').style.display='none';$('#md').innerHTML=''}
function msg(t){const m=$('#mm');if(m)m.textContent=t}
function normCode(raw){const v=String(raw||'').trim().toUpperCase().replace(/\s+/g,'');if(!v)return '';
 let m=v.match(/^([A-Z]{3}\.[A-Z]{2})\.?(\d{1,6})$/);if(m)return m[1]+'.'+m[2].padStart(6,'0');
 if(/^\d{1,6}$/.test(v))return S.prefijo?S.prefijo+'.'+v.padStart(6,'0'):'';return v}

/* ===== API ===== */
async function api(a,d){d=d||{};if(!URL_API)return demo(a,d);
 try{let r;if(['buscar','resumen','ping','misconteos','previa'].includes(a))r=await fetch(URL_API+'?'+new URLSearchParams({accion:a,...d}));
  else r=await fetch(URL_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({accion:a,...d})});
  return await r.json()}catch(e){return{ok:false,error:'Sin conexión con la hoja. Revisa tu internet e inténtalo otra vez.'}}}

/* ===== Pantallas ===== */
function welcomeH(){const b=n=>'<button data-a="asesor" data-v="'+n+'" style="--c:'+(n==2?'#2563eb':'#0a8f2a')+'"><span>'+(n==2?'🅱️':'🅰️')+' Asesor '+n+'</span><small>Conteo '+n+(NAMES[n]?' · '+E(NAMES[n]):'')+'</small></button>';
 return '<h1>Inventario</h1><p class="sub">Bienvenido, ¿quién va a contar?</p><div class="wl">'+b(1)+b(2)+'</div>'}
function nameH(){return '<h1>'+(PICK==2?'🅱️':'🅰️')+' Asesor '+PICK+'</h1><p class="sub">Conteo '+PICK+'</p><div class="card"><label style="margin-top:0">Tu nombre<input id="sn" type="text" maxlength="60" value="'+E(NAMES[PICK]||'')+'" placeholder="Nombre y apellido" autocomplete="off"></label><div id="mm" class="ms"></div><button class="bt big" data-a="entrar">Entrar</button><button class="bt big w" data-a="cambiar">← Volver</button></div>'}
function contarH(){if(!S.prefijo)S.prefijo=PREF_DEF;const p=S.prefijo.split('.');
 return '<div class="card"><label style="margin-top:0">Familia y subfamilia</label><div class="cf"><div><small>Familia (3 letras)</small><input id="fam" type="text" maxlength="3" value="'+E(p[0])+'" placeholder="FER" autocomplete="off"></div><b>.</b><div><small>Subfamilia (2 letras)</small><input id="sub" type="text" maxlength="2" value="'+E(p[1])+'" placeholder="AA" autocomplete="off"></div></div></div>'
 +'<div class="card"><label style="margin-top:0">Código (6 dígitos)</label><div class="cw"><span id="pfx">'+E(S.prefijo)+'.</span><input id="cod" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="002828" autocomplete="off"></div><div id="res"></div></div>'
 +(HIST.length?'<h3>Mis últimos registros</h3>'+HIST.map(x=>'<div class="tr hl" data-a="irA" data-v="'+E(x.c)+'"><div class="in"><b>'+E(x.c)+'</b> · '+E(x.d)+'<small>Cantidad '+E(x.q)+' · Fallados '+E(x.f)+' · toca para corregir</small></div>✏️</div>').join(''):'')}
function R(){const a=$('#app');$('#cfgb').style.display=SCR=='main'?'block':'none';
 if(SCR=='welcome'){a.innerHTML=welcomeH();return}
 if(SCR=='name'){a.innerHTML=nameH();setTimeout(()=>{const i=$('#sn');if(i)i.focus()},50);return}
 let h='<div class="top"><span class="chip" style="--c:'+colC()+'">Conteo '+S.conteo+'</span><span class="ttl">'+E(S.nombre)+'</span></div>'+(!URL_API?'<div class="demo">🧪 Modo de prueba: los datos solo se guardan en este navegador.</div>':'')
  +'<div class="tabs"><button data-a="tab" data-v="contar" class="'+(TAB=='contar'?'on':'')+'">✍️ Contar</button><button data-a="tab" data-v="rev" class="'+(TAB=='rev'?'on':'')+'">🔎 Revisión</button></div>'
  +'<div class="mbar" style="margin-bottom:12px"><button class="bt s w" data-a="misc">📋 Mis conteos</button><button class="bt s w" data-a="previa">🖼 Vista previa Excel</button></div>';
 if(TAB=='contar'){a.innerHTML=h+contarH();setTimeout(()=>{const i=$('#cod');if(i)i.focus()},50)}
 else{a.innerHTML=h+'<div id="rv"></div>';loadRev()}}

/* ===== Mis conteos (buscador) ===== */
const nq=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
async function abrirMC(){const X='<button class="x" data-a="cerrar">✕</button><h3>📋 Mis conteos';
 modal(X+'</h3><div class="emp">Cargando…</div>',colC());
 const r=await api('misconteos',{conteo:S.conteo});
 if(!r.ok){modal(X+'</h3><div class="bad">'+E(r.error||'No se pudo cargar.')+'</div>',colC());return}
 MCL=r.items||[];modal(X+' ('+MCL.length+')</h3><input id="bq" type="text" placeholder="Buscar por código o descripción…" autocomplete="off"><div id="bl"></div>',colC());renderMC('');setTimeout(()=>{const i=$('#bq');if(i)i.focus()},50)}
function renderMC(q){const b=$('#bl');if(!b)return;const ws=nq(q).split(/\s+/).filter(Boolean),L=MCL.filter(x=>{const t=nq(x.codigo+' '+x.descripcion);return ws.every(w=>t.includes(w))});
 b.innerHTML=L.length?L.slice(0,150).map(x=>'<div class="tr hl" data-a="irA" data-v="'+E(x.codigo)+'"><div class="in"><b>'+E(x.codigo)+'</b> · '+E(x.descripcion)+'<small>Cantidad '+E(x.cantidad)+' · Fallados '+E(x.fallados)+' · '+E(x.udm||'')+'</small></div>✏️</div>').join('')+(L.length>150?'<div class="emp">Mostrando 150 de '+L.length+'. Escribe para filtrar.</div>':''):'<div class="emp">Sin resultados</div>'}
function irA(code){cerrar();const m=String(code).match(/^([A-Z]{3})\.([A-Z]{2})\.(\d{6})$/);if(m){S.prefijo=m[1]+'.'+m[2];ls('inv_cfg',S)}
 TAB='contar';R();$('#cod').value=String(code).split('.').pop();buscar(code);window.scrollTo(0,0)}

/* ===== Vista previa de la hoja (imagen) ===== */
async function previa(){toast('Armando vista previa…');const r=await api('previa');
 if(!r.ok){toast(r.error||'No se pudo generar.');return}
 const d=r.datos||[],X='<button class="x" data-a="cerrar">✕</button><h3>🖼 Vista previa de la hoja</h3>';
 if(!d.length){modal(X+'<p class="ds">Aún no hay códigos conciliados en la hoja «Para copiar al excel».</p>',colC());return}
 LASTIMG=dibujar(d.slice(0,500));
 modal(X+'<p class="ds">'+d.length+' filas'+(d.length>500?' (se muestran las primeras 500)':'')+'. Es solo una imagen de referencia.</p><div style="overflow:auto;border:2px solid var(--bd);border-radius:10px"><img src="'+LASTIMG+'" style="display:block;width:100%;min-width:640px"></div><div class="fx"><button class="bt w" data-a="cerrar">Cerrar</button><button class="bt" data-a="bajarimg">⬇ Descargar PNG</button></div>',colC(),true)}
function dibujar(d){const cab=['Número','Codigo','Descripcion','UDM','Conteo','Fallados','Total'],W=[70,150,400,70,90,90,90],RH=34,tw=W.reduce((a,b)=>a+b,0),H=RH*(d.length+1),
 sc=Math.max(.5,Math.min(2,Math.sqrt(14e6/(tw*H)),30000/H)),cv=document.createElement('canvas');cv.width=Math.round(tw*sc);cv.height=Math.round(H*sc);
 const g=cv.getContext('2d');g.scale(sc,sc);g.fillStyle='#fff';g.fillRect(0,0,tw,H);g.textBaseline='middle';
 const T=['#fde2e4','#dff0e3','#dbe7fd','#fff1c4','#eadcf7','#d5eff5','#ffe3cc','#e8f0c8'],X=[0];W.forEach((w,i)=>X.push(X[i]+w));
 const fit=(t,w)=>{t=String(t==null?'':t);if(g.measureText(t).width<=w)return t;while(t.length&&g.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'};
 [cab].concat(d).forEach((row,r)=>{const y=r*RH;g.fillStyle=r?T[(r-1)%T.length]:'#c9dedc';g.fillRect(0,y,tw,RH);g.fillStyle='#13302a';g.font=(r?'':'bold ')+'14px Arial,sans-serif';
  row.forEach((v,c)=>{const al=r&&[0,4,5,6].includes(c);g.textAlign=al?'right':'left';g.fillText(fit(v,W[c]-16),al?X[c+1]-8:X[c]+8,y+RH/2)})});
 g.strokeStyle='#6f827c';g.lineWidth=1;g.beginPath();
 for(let r=0;r<=d.length+1;r++){const y=r==d.length+1?H-.5:r*RH+.5;g.moveTo(0,y);g.lineTo(tw,y)}
 for(let c=0;c<=W.length;c++){const x=c==W.length?tw-.5:X[c]+.5;g.moveTo(x,0);g.lineTo(x,H)}
 g.stroke();return cv.toDataURL('image/png')}

/* ===== Contar ===== */
async function buscar(code){if(!code)return;const t=++LOOK,res=$('#res');CUR=null;res.innerHTML='<div class="emp">Buscando…</div>';
 const r=await api('buscar',{codigo:code,conteo:S.conteo});if(t!=LOOK||!$('#res'))return;
 if(!r.ok){res.innerHTML='<div class="bad" style="margin-top:10px">'+E(r.error||'No se pudo buscar.')+'</div>';return}
 CUR=r;res.innerHTML='<div style="margin-top:12px"><div class="cdb">'+E(r.codigo)+'</div><div class="dsc">'+E(r.descripcion)+'</div><span class="tg">UDM: '+E(r.udm||'—')+'</span>'
  +(r.yaContado?'<div class="note">Ya registraste este código (cantidad '+E(r.cantidad)+', fallados '+E(r.fallados===''?0:r.fallados)+'). Para corregir, escribe de nuevo ambos valores.</div>':'')
  +'<div class="two"><label>Cantidad<input id="qc" type="number" inputmode="decimal" min="0" step="any" placeholder=" "></label><label>Fallados<input id="qf" type="number" inputmode="decimal" min="0" step="any" placeholder=" "></label></div>'
  +'<div id="mm" class="ms"></div><button id="gb" class="bt big" data-a="guardar">Guardar ✔</button></div>';
 const q=$('#qc');q.focus();q.select()}
async function guardar(){if(!CUR)return;const c=$('#qc').value,f=$('#qf').value;
 const falt=[];if(c==='')falt.push('Cantidad');if(f==='')falt.push('Fallados');if(falt.length){msg('⚠ Falta llenar: '+falt.join(' y ')+'. Si no hay, escribe 0.');return}
 if(isNaN(+c)||+c<0||isNaN(+f)||+f<0){msg('Revisa los números: no pueden ser negativos.');return}
 const b=$('#gb');b.disabled=true;b.textContent='Guardando…';
 const r=await api('guardar',{codigo:CUR.codigo,conteo:S.conteo,cantidad:+c,fallados:+f,asesor:S.nombre});
 if(!r.ok){b.disabled=false;b.textContent='Guardar ✔';msg(r.error||'No se pudo guardar.');return}
 HIST=HIST.filter(x=>x.c!=CUR.codigo);HIST.unshift({c:CUR.codigo,d:CUR.descripcion,q:+c,f:+f});HIST=HIST.slice(0,12);ls('inv_hist',HIST);
 toast('✅ Guardado '+CUR.codigo);CUR=null;R()}

/* ===== Revisión ===== */
async function loadRev(){const v=$('#rv');v.innerHTML='<div class="emp">Cargando…</div>';REV=await api('resumen');renderRev()}
function renderRev(){const r=REV,v=$('#rv');if(!v)return;
 if(!r||!r.ok){v.innerHTML='<div class="bad">'+E(r&&r.error||'No se pudo cargar.')+'</div>';return}
 let h='<div class="mbar"><button class="bt s w" data-a="refrescar">🔄 Actualizar</button><button class="bt s" data-a="generar">📤 Generar hoja Resultado</button></div>'
  +'<div class="chips"><span>Contados: '+r.contados+'</span><span style="color:#06621c">✅ Coinciden: '+r.coinciden+'</span><span style="color:#2563eb">✔ Resueltos: '+r.resueltos+'</span><span style="color:#be123c">⚠ Recontar: '+r.recontar.length+'</span><span style="color:#b45309">⏳ Pendientes: '+r.pendientes.length+'</span></div>';
 h+='<h3>⚠ Por recontar</h3>'+(r.recontar.length?r.recontar.map(x=>'<div class="tr err"><div class="in"><b>'+E(x.codigo)+'</b> · '+E(x.descripcion)+'<small>Conteo 1: <span class="'+(x.difC?'dif':'')+'">'+fm(x.c1)+'</span> (fallados <span class="'+(x.difF?'dif':'')+'">'+fm(x.f1)+'</span>) · Conteo 2: <span class="'+(x.difC?'dif':'')+'">'+fm(x.c2)+'</span> (fallados <span class="'+(x.difF?'dif':'')+'">'+fm(x.f2)+'</span>)</small></div><button class="bt s" data-a="resolver" data-v="'+E(x.codigo)+'">Resolver</button></div>').join(''):'<div class="emp">Nada por recontar 🎉</div>');
 h+='<h3>⏳ Falta el otro conteo</h3>'+(r.pendientes.length?r.pendientes.map(x=>'<div class="tr wt"><div class="in"><b>'+E(x.codigo)+'</b> · '+E(x.descripcion)+'<small>Falta el conteo '+x.falta+'</small></div></div>').join(''):'<div class="emp">Sin pendientes</div>');
 v.innerHTML=h}
function resolverM(code){const x=REV.recontar.find(y=>y.codigo==code);if(!x)return;
 modal('<button class="x" data-a="cerrar">✕</button><h3>Resolver reconteo</h3><p class="ds"><b>'+E(x.codigo)+'</b> · '+E(x.descripcion)+'<br>Conteo 1: '+fm(x.c1)+' (fall. '+fm(x.f1)+') · Conteo 2: '+fm(x.c2)+' (fall. '+fm(x.f2)+')</p>'
  +'<p class="ds">Cuenten juntos otra vez y escriban el valor final acordado.</p><div class="two"><label>Cantidad final<input id="rc" type="number" inputmode="decimal" min="0" step="any" placeholder=" "></label><label>Fallados final<input id="rf" type="number" inputmode="decimal" min="0" step="any" placeholder=" "></label></div><div id="mm" class="ms"></div>'
  +'<div class="fx"><button class="bt w" data-a="cerrar">Cancelar</button><button class="bt" data-a="guardarres" data-v="'+E(code)+'">Guardar</button></div>','#e11d48');setTimeout(()=>$('#rc').focus(),50)}
async function guardarRes(code){const c=$('#rc').value,f=$('#rf').value;
 const fl=[];if(c==='')fl.push('Cantidad');if(f==='')fl.push('Fallados');if(fl.length){msg('⚠ Falta llenar: '+fl.join(' y ')+'. Si no hay, escribe 0.');return}if(isNaN(+c)||+c<0||isNaN(+f)||+f<0){msg('Revisa los números.');return}
 const r=await api('resolver',{codigo:code,cantidad:+c,fallados:+f});if(!r.ok){msg(r.error||'No se pudo guardar.');return}
 cerrar();toast('✔ Resuelto '+code);loadRev()}
let LASTX=null;
function descargar(datos,nombre){const cab=['Número','Código','Descripción','UDM','Conteo','Fallados','Total'];
 try{if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet([cab].concat(datos));ws['!cols']=[{wch:8},{wch:16},{wch:50},{wch:8},{wch:10},{wch:10},{wch:10}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Resultado');XLSX.writeFile(wb,nombre+'.xlsx');return true}}catch(e){}
 const csv='﻿'+[cab].concat(datos).map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=nombre+'.csv';document.body.appendChild(a);a.click();a.remove();return false}
async function gen(forzar){toast('Generando…');
 const r=await api('generar',{forzar:!!forzar});
 if(r.bloqueado){modal('<button class="x" data-a="cerrar">✕</button><h3>Hay códigos sin conciliar</h3><p class="ds">⚠ '+r.recontar+' por recontar y ⏳ '+r.pendientes+' con un solo conteo.<br>¿Generar igual solo con los <b>'+r.listos+'</b> ya conciliados?</p><div class="fx"><button class="bt w" data-a="cerrar">Volver</button><button class="bt" data-a="genforzar">Generar igual</button></div>','#f58a07');return}
 if(!r.ok){toast(r.error||'No se pudo generar.');return}
 const d=new Date(),f=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 LASTX={d:r.datos||[],n:'Inventario_'+(S.prefijo||'').replace('.','')+'_'+f};
 const xl=descargar(LASTX.d,LASTX.n);
 modal('<button class="x" data-a="cerrar">✕</button><h3>✅ Excel generado</h3><p class="ds">Se descargaron <b>'+r.filas+'</b> filas'+(r.excluidos?' ('+r.excluidos+' códigos sin conciliar quedaron fuera)':'')+(xl?'.':' en formato CSV (no cargó el generador de Excel; ábrelo con Excel igual).')+' La hoja «Resultado» de Sheets también quedó actualizada.</p><div class="fx"><button class="bt w" data-a="redescargar">Descargar otra vez</button><button class="bt" data-a="cerrar">Cerrar</button></div>')}

/* ===== Eventos ===== */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t){if(e.target.id=='md')cerrar();return}
 const a=t.dataset.a,v=t.dataset.v;
 if(a=='asesor'){PICK=+v;SCR='name';R()}
 else if(a=='entrar'){const n=$('#sn').value.trim();if(!n){msg('Escribe tu nombre.');return}NAMES[PICK]=n;ls('inv_names',NAMES);
  if(S.conteo!=PICK||S.nombre!=n){HIST=[];ls('inv_hist',HIST)}S={nombre:n,conteo:PICK,prefijo:S.prefijo||PREF_DEF};ls('inv_cfg',S);SCR='main';TAB='contar';R()}
 else if(a=='cambiar'){SCR='welcome';R()}
 else if(a=='misc')abrirMC()
 else if(a=='previa')previa()
 else if(a=='bajarimg'){const l=document.createElement('a');l.href=LASTIMG;l.download='Vista_previa_inventario.png';document.body.appendChild(l);l.click();l.remove()}
 else if(a=='tab'){TAB=v;R()}
 else if(a=='guardar')guardar()
 else if(a=='irA')irA(v)
 else if(a=='refrescar')loadRev()
 else if(a=='resolver')resolverM(v)
 else if(a=='guardarres')guardarRes(v)
 else if(a=='generar')gen(false)
 else if(a=='redescargar'){if(LASTX)descargar(LASTX.d,LASTX.n)}
 else if(a=='genforzar')gen(true)
 else if(a=='cerrar')cerrar()});
document.addEventListener('input',e=>{const id=e.target.id;
 if(id=='fam'||id=='sub'){e.target.value=e.target.value.replace(/[^A-Za-z]/g,'').toUpperCase();
  const f=$('#fam').value,u=$('#sub').value,ok=f.length==3&&u.length==2;S.prefijo=ok?f+'.'+u:'';ls('inv_cfg',S);$('#pfx').textContent=(f||'???')+'.'+(u||'??')+'.';
  CUR=null;LOOK++;$('#res').innerHTML='';
  if(id=='fam'&&f.length==3)$('#sub').focus();
  else if(id=='sub'&&ok){const c=$('#cod');c.focus();if(/^\d{6}$/.test(c.value))buscar(normCode(c.value))}
  return}
 if(id=='cod'){const v=e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);CUR=null;
  if(v.length==6){if(!S.prefijo){LOOK++;$('#res').innerHTML='<div class="bad" style="margin-top:10px">Completa familia (3 letras) y subfamilia (2 letras).</div>';return}buscar(normCode(v))}
  else{LOOK++;$('#res').innerHTML=''}}
 if(id=='bq')renderMC(e.target.value)});
document.addEventListener('keydown',e=>{
 if(e.key=='Escape')cerrar();
 if(e.key=='Enter'){const id=e.target.id;
  if(id=='cod'){const c=normCode(e.target.value);if(c)buscar(c)}
  else if(id=='sn'){e.preventDefault();$('[data-a=entrar]').click()}
  else if(id=='qc'){e.preventDefault();$('#qf').focus();$('#qf').select()}
  else if(id=='qf')guardar()
  }});

/* ===== MODO DE PRUEBA (sin conexión a Sheets) ===== */
const DEMO_CAT=[['FER.TI.002828','Tirador barra acero inox 128 mm','UND'],['FER.TI.002829','Tirador concha cromado','UND'],['FER.TI.002830','Tirador bola negro','UND'],['FER.TI.002831','Tirador perfil aluminio 160 mm','UND'],['FER.TI.002832','Tirador bronce antiguo 96 mm','PAR']];
let DD=ls('inv_demo_v1');if(!DD){DD={};DEMO_CAT.forEach(c=>DD[c[0]]={d:c[1],u:c[2],c1:'',c2:'',f1:'',f2:'',cf:'',ff:'',o1:'',o2:''})}
const dsave=()=>ls('inv_demo_v1',DD);
const estD=r=>{if(r.cf!==''&&r.ff!=='')return 'RESUELTO';const a=r.c1!=='',b=r.c2!=='';if(!a&&!b)return '';if(!a||!b)return 'PENDIENTE';return(+r.c1==+r.c2&&+(r.f1||0)==+(r.f2||0))?'OK':'RECONTAR'};
function demo(a,d){return new Promise(res=>setTimeout(()=>res(demoSync(a,d)),250))}
function demoSync(a,d){const n=d.conteo==2?2:1;
 if(a=='buscar'){const r=DD[d.codigo];if(!r)return{ok:false,error:'Código no encontrado: '+d.codigo};return{ok:true,codigo:d.codigo,descripcion:r.d,udm:r.u,yaContado:r['c'+n]!=='',cantidad:r['c'+n],fallados:r['f'+n]}}
 if(a=='guardar'){const r=DD[d.codigo];if(!r)return{ok:false,error:'Código no encontrado'};if(r['o'+n]==='')r['o'+n]=Math.max(0,...Object.values(DD).map(x=>+x['o'+n]||0))+1;
  r['c'+n]=d.cantidad;r['f'+n]=d.fallados;r.cf='';r.ff='';dsave();return{ok:true}}
 if(a=='misconteos')return{ok:true,items:Object.keys(DD).filter(k=>DD[k]['c'+n]!=='').sort((x,y)=>(+DD[y]['o'+n]||0)-(+DD[x]['o'+n]||0)).map(k=>({codigo:k,descripcion:DD[k].d,udm:DD[k].u,cantidad:DD[k]['c'+n],fallados:+(DD[k]['f'+n]||0)}))}
 if(a=='previa'){const dt=Object.keys(DD).filter(k=>{const e=estD(DD[k]);return e=='OK'||e=='RESUELTO'}).map((k,i)=>{const r=DD[k],e=estD(r),c=e=='OK'?+r.c1:+r.cf,f=e=='OK'?+(r.f1||0):+r.ff;return[i+1,k,r.d,r.u,c,f,c+f]});return{ok:true,datos:dt}}
 if(a=='resumen'){const o={ok:true,contados:0,coinciden:0,resueltos:0,recontar:[],pendientes:[]};
  Object.keys(DD).forEach(k=>{const r=DD[k],e=estD(r);if(!e)return;o.contados++;const b={codigo:k,descripcion:r.d,udm:r.u};
   if(e=='OK')o.coinciden++;else if(e=='RESUELTO')o.resueltos++;
   else if(e=='RECONTAR')o.recontar.push({...b,c1:r.c1,f1:+(r.f1||0),c2:r.c2,f2:+(r.f2||0),difC:+r.c1!=+r.c2,difF:+(r.f1||0)!=+(r.f2||0)});
   else o.pendientes.push({...b,falta:r.c1===''?1:2})});return o}
 if(a=='resolver'){const r=DD[d.codigo];if(!r)return{ok:false,error:'Código no encontrado'};r.cf=d.cantidad;r.ff=d.fallados;dsave();return{ok:true}}
 if(a=='generar'){
  const L=Object.values(DD),rc=L.filter(r=>estD(r)=='RECONTAR').length,pe=L.filter(r=>estD(r)=='PENDIENTE').length,ok=L.filter(r=>{const e=estD(r);return e=='OK'||e=='RESUELTO'}).length;
  if((rc||pe)&&!d.forzar)return{ok:false,bloqueado:true,recontar:rc,pendientes:pe,listos:ok};const dt=Object.keys(DD).filter(k=>{const e=estD(DD[k]);return e=='OK'||e=='RESUELTO'}).map((k,i)=>{const r=DD[k],e=estD(r),c=e=='OK'?+r.c1:+r.cf,f=e=='OK'?+(r.f1||0):+r.ff;return[i+1,k,r.d,r.u,c,f,c+f]});return{ok:true,filas:ok,excluidos:rc+pe,datos:dt}}
 return{ok:false,error:'Acción no válida'}}
R();
</script></body></html>
